<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lomba Dayung HSU</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 360px; }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 0.9rem; opacity: 0.9; margin-bottom: 20px; }
  a.btn {
    display: inline-block;
    background: #fff;
    color: #1e40af;
    text-decoration: none;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  .fallback { display: none; margin-top: 18px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Membuka Aplikasi Lomba Dayung HSU…</h1>
    <p>Mohon tunggu sebentar, Anda akan diarahkan otomatis.</p>
    <div class="fallback" id="fallback">
      <a class="btn" id="manualLink" href="#">Buka Manual</a>
    </div>
  </div>

<script>
  // Ganti URL di bawah jika deployment Apps Script berubah
  var APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlwKiEili9xmlc-DgaGhTmP7qu0Q0utnd3r4wCeV5I6aAttLUc-8bILQd1IuTO2CSdBQ/exec";

  document.getElementById("manualLink").href = APPSCRIPT_URL;

  // Redirect otomatis ke Apps Script
  setTimeout(function () {
    window.location.replace(APPSCRIPT_URL);
  }, 600);

  // Jika karena suatu hal redirect gagal (browser memblokir dsb), tampilkan tombol manual
  setTimeout(function () {
    document.getElementById("fallback").style.display = "block";
  }, 3000);
</script>
</body>
</html>
